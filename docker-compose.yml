services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: future_blog
      DB_USER: future_user
      DB_PASSWORD: future_password
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: future_blog
      MYSQL_USER: future_user
      MYSQL_PASSWORD: future_password
      MYSQL_ROOT_PASSWORD: local_root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mysql_data:

